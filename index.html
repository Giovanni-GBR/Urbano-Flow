<!DOCTYPE html>
<html lang="PT-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Urban Flow</title>
 
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/header/hea.css">
  
    <script src="https://kit.fontawesome.com/0f437c02b4.js" crossorigin="anonymous">
      </script>
</head>

<body>
  
  <header class="cabecalho">
    <nav class="nav-head">
      <div class="img">
        <img src="/Assenta/Imagens/Ativo 1BecoPng.png" alt="Logo Urban Flow" class="img-head">
      </div>
      <ul>
        <li>
          <a href="#Skate">Skate</a>
        </li>
        <li>
          <select name="aparencia" id="aparencia">
            <option value="aparencia" disabled selected>Aparência</option>
          </select>
        </li>
        <li>
          <select name="colecoes" id="colecoes">
            <option value="Colecoes" disabled selected>Coleçoes</option>
          </select>
        </li>
        <li class="nav-loja"><a href="">Loja</a></li>
        
        
      </ul>
      <div class="navegacao">
        <div class="nav-pesq">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="O que você procura">
        </div>
        <div class="perf">
          <a href=""><i class="fa-solid fa-shop"></i></a>
          <i class="fa-solid fa-user"></i>
        </div>
      </div>
    </nav>
  </header>
  
  
  
  
  <main class="conteiner-principal">
    <section class="secao-principal sec-principais">
      <div class="head-img-sec">
        <img src="/Assenta/Imagens/profile-7579739.png" alt="imagem de um skatista" class="img-principal">
      </div>
    </section>
    
    <section class="secao-ofertas sec-principais">
      <header class="head-ofertas cabeca">
        <div class="oferta-day icons-oferta">
          <i class="fa-regular fa-clock"></i>
          <p>Ofertas do dia</p>
        </div>
        <div class="oferta-end icons-oferta">
          
          <p>Ofertas acabam em:</p>
        </div>
        <div class="icons-oferta time-oferta">
          <span>00:</span>
          <span>00</span>
        </div>
      </header>
      <div class="container-ofertas">
        <div class="content-ofertas">
          <img src="/Assenta/Imagens/ofertas/Free_Skateboard_Mockup_53.png" alt="skate">
        </div>
        <div class="content-ofertas">
          <img src="/Assenta/Imagens/ofertas/Free_Skateboard_Mockup_52.png" alt="">
        </div>
        <div class="content-ofertas">
          <img src="/Assenta/Imagens/ofertas/Free_Skateboard_Mockup_5.png" alt="">
        </div>
        <div class="content-ofertas">
          <img src="/Assenta/Imagens/ofertas/Camisadobrada3.png" alt="">
        </div>
        <div class="content-ofertas">
          <img src="/Assenta/Imagens/ofertas/Camisadobrada2.png" alt="">
        </div>
      </div>
    </section>
    
    <section class="sec-principais skate" id="Skate">
      <header class="skate-hea cabeca">
        <h2>Skate</h2>
      </header>
      <div class="box-skate">
        <div class="img-skate">
          <img src="/Assenta/Imagens/skate/images.jpeg" alt="">
        </div>
        <div class="content-skate">
          <div>
            <ul>
              <li>
                <h3>
                  <select class="shape-skate">
                    <option value="" selected disabled>Shape</option>
                    <option value="marfin" disabled>Marfin</option>
                    <option value="maple" disabled>Maple</option>
                  </select>
                </h3>
              </li>
              
              <li><h3>Rolamento</h3></li>
              <li><h3>Roda</h3></li>
              <li><h3>Truck</h3></li>
              <li><h3>Lixa</h3></li>
            </ul>
            
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <script src="main.js"></script>
</body>
</html>
